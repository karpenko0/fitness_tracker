services:
  # Shared Redis cache and rate-limit store
  redis:
    image: redis:7-alpine
    container_name: fitness_tracker_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitness_network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fitness_tracker_db
    environment:
      POSTGRES_USER: fitness_user
      POSTGRES_PASSWORD: fitness_password
      POSTGRES_DB: fitness_tracker
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitness_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: fitness_tracker_api
    environment:
      DATABASE_URL: postgresql://fitness_user:fitness_password@postgres:5432/fitness_tracker
      JWT_ACCESS_SECRET: your-secret-key-change-in-production-min-32-chars
      DIRECT_URL: postgresql://fitness_user:fitness_password@postgres:5432/fitness_tracker
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: "true"
      PORT: 8000
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npm run prisma:migrate && node dist/main.js"
    networks:
      - fitness_network

  # Frontend App
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: fitness_tracker_web
    environment:
      REACT_APP_API_URL: http://localhost:8000/api/v1
      REACT_APP_ENVIRONMENT: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - fitness_network

volumes:
  postgres_data:
  redis_data:

networks:
  fitness_network:
    driver: bridge
